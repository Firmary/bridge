name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # GitHub-hosted only. This code runs on people's computers; never build it on a self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build for macOS, Windows and Linux (pure Go)
        run: |
          for target in darwin/arm64 darwin/amd64 windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./... || exit 1
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go vet ./... || exit 1
          done

  macos:
    # The macOS tray needs cgo, which only builds on a Mac.
    # GitHub-hosted only. This code runs on people's computers; never build it on a self-hosted runner.
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Build and vet for arm64 (cgo)
        env:
          GOARCH: arm64
        run: |
          go build ./...
          go vet ./...
      - name: Build and vet for amd64 (cgo)
        env:
          GOARCH: amd64
          CC: clang -arch x86_64
        run: |
          go build ./...
          go vet ./...

  windows:
    # What only runs on Windows: the pairing-code box (a real dialog on the runner's desktop) and the Windows paths.
    # GitHub-hosted only. This code runs on people's computers; never build it on a self-hosted runner.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go test ./...
