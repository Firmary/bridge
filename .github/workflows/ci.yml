name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # GitHub-hosted only. This code runs on people's computers; never build it on a self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build for macOS, Windows and Linux (pure Go)
        run: |
          for target in darwin/arm64 darwin/amd64 windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./... || exit 1
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go vet ./... || exit 1
          done

  macos:
    # The macOS tray needs cgo, which only builds on a Mac.
    # GitHub-hosted only. This code runs on people's computers; never build it on a self-hosted runner.
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Build and vet for arm64 (cgo)
        env:
          GOARCH: arm64
        run: |
          go build ./...
          go vet ./...
      - name: Build and vet for amd64 (cgo)
        env:
          GOARCH: amd64
          CC: clang -arch x86_64
        run: |
          go build ./...
          go vet ./...

  windows:
    # What only runs on Windows: the pairing-code box (a real dialog on the runner's desktop) and the Windows paths.
    # GitHub-hosted only. This code runs on people's computers; never build it on a self-hosted runner.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  windows-screenshot:
    # TEMPORARY (removed before merge): the tray app's first-run code box on a real Windows desktop.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Open the app and take screenshots
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags "-s -w -X main.version=0.3.1 -H windowsgui" -o link.exe ./cmd/firmary-link
          Set-Content -Path key.pub -Value "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          Start-Process -FilePath .\link.exe -ArgumentList "app","--env","local","--relay-url","ws://127.0.0.1:9/","--ticket-key-file","$PWD\key.pub","--data-dir","$env:RUNNER_TEMP\linkdata","--no-update"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          foreach ($i in 1..3) {
            Start-Sleep -Seconds 4
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\screen-$i.png")
          }
          Get-Process link -ErrorAction SilentlyContinue | Stop-Process -Force
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-code-box
          path: shots
