# OpenQodex settings for this repo. Only version is set: every other key below is
# a comment that shows its default, and a later release may change a default.
# To set a key, remove the `# ` that starts its line and the lines of the blocks
# above it. Each key is explained by: openqodex guide config
version: 1
min_version: 0.24.0
review:
  # One reviewer, Claude Code on the sign-in of the shell that runs the review (Daniel's subscription, never an API key).
  # Opus at medium effort: on a real PR it caught the defect Sonnet missed, for 15% less than Opus at high effort.
  reviewers:
    - tool: claude
      model: opus
      effort: medium
  # The review rules, shared with RoboRev.
  instructions_files: [REVIEW.md]
  paths:
    # Docs and generated files are not reviewed.
    exclude: ["*.md", "**/*.md", "bin/**", "dist/**", "cmd/firmary-link/rsrc_windows_*.syso", "internal/protocol/testdata/**", "go.sum"]

# # The oldest openqodex that may read this file, such as 0.9.0; an older one stops with exit 2 and names the version it needs.
# min_version: null
# review:
#   # Findings below this severity stay out of the report; one at or above block_on_severity is always shown.
#   severity_threshold: minor
#   # Exit 1 and deny the push when a finding on a changed line is at or above this severity; null never blocks.
#   block_on_severity: null
#   paths:
#     # Globs of files left out of the change.
#     exclude: []
#   # Globs on a finding's citation, such as gitleaks:generic-api-key or lens:react-*.
#   disabled_rules: []
#   # The branch or ref to diff against when the branch has no upstream; null uses the remote's default branch.
#   default_base: null
#   # Keep scanner findings in test fixtures, mocks and snapshots.
#   include_fixtures: false
#   # Repo-relative convention paths or globs the owners chose for the reviewer. Empty reads none.
#   instructions_files: []
#   # Staged review, the default, splits the change into units. A unit holds a few small files, one measured part or one [structural summary](claude-code-review.md#structural-summaries). Two fresh finder sessions read each unit. A fresh verifier then checks the candidates on each changed file. `false` selects the legacy single pass, without parts, structural summaries or coverage labels. The single pass brief carries at most 200 KB of diff text. Only the single pass has that cap. Its delivery pages hold at most 4,000 rows and 512 KB, as in the staged review. Both routes cut a line over 2,000 bytes into fragments. The single pass does not require a replaced line's old text; its pages still carry pure deletions in fragments. `--agent` and `--all` always run one pass.
#   stages: true
#   # The reviewers to try, top to bottom, each a `tool` (claude or codex) with an optional `model` and `effort`. One that cannot start here is passed over with its reason; one whose model hits a limit or cannot serve stops the review, which starts again on the next entry. Empty: the agent you run the review from, then Claude Code, then Codex. `openqodex guide config` lists the values each tool takes.
#   reviewers: []
#   # `off` removes the reviewer's web tools: Claude Code's WebSearch and WebFetch, Codex's cached web search. `--reviewer-web` wins for one run.
#   reviewer_web: on
# scanners:
#   # Built-in scanners to switch off, by name.
#   disable: []
#   # Open source scanners to add by GitHub link; each runs only after openqodex trust.
#   custom: []
# graph:
#   # Show the callers and importers of the changed code in the brief.
#   enabled: true
#   # Time the code graph may take, in milliseconds.
#   budget_ms: 10000
#   # New parses per build: files past this count wait for a later build. Facts already cached are not counted.
#   max_files: 4000
#   # Files larger than this, in bytes, are left out of the code graph.
#   max_file_bytes: 524288
#   # The size bound of .openqodex/graph/, in MB; the oldest builds and facts no kept build names are removed first.
#   max_cache_mb: 512
#   # The memory the code graph may use, in MB; files past it are left out and the graph says so.
#   max_heap_mb: 1536
